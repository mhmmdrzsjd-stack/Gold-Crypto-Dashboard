<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureID | ثبت نام</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page">

    <div class="auth-card">

        <div class="brand">
            <div class="brand-icon">S</div>
            <span>SecureID</span>
        </div>

        <div class="progress-area">
            <div class="step active">
                <span>1</span>
                <p>ثبت نام</p>
            </div>

            <div class="line"></div>

            <div class="step">
                <span>2</span>
                <p>احراز هویت</p>
            </div>

            <div class="line"></div>

            <div class="step">
                <span>3</span>
                <p>تکمیل</p>
            </div>
        </div>

        <h1>ایجاد حساب کاربری</h1>

        <p class="description">
            اطلاعات خود را وارد کنید تا حساب کاربری شما ایجاد شود.
        </p>

        <form>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>نام</label>
                    <input
                        type="text"
                        class="form-control"
                        placeholder="محمد"
                        required
                    >
                </div>

                <div class="col-md-6 mb-3">
                    <label>نام خانوادگی</label>
                    <input
                        type="text"
                        class="form-control"
                        placeholder="رضایی"
                        required
                    >
                </div>

            </div>

            <div class="mb-3">
                <label>شماره موبایل</label>

                <input
                    type="tel"
                    class="form-control"
                    placeholder="09123456789"
                    required
                >
            </div>

            <div class="mb-3">
                <label>ایمیل</label>

                <input
                    type="email"
                    class="form-control"
                    placeholder="example@gmail.com"
                    required
                >
            </div>

            <div class="mb-4">
                <label>رمز عبور</label>

                <input
                    type="password"
                    class="form-control"
                    placeholder="••••••••"
                    required
                >
            </div>

            <div class="form-check mb-4">
                <input
                    class="form-check-input"
                    type="checkbox"
                    id="rules"
                    required
                >

                <label class="form-check-label" for="rules">
                    قوانین و شرایط را می‌پذیرم
                </label>
            </div>

            <button
                type="button"
                class="main-btn"
                onclick="location.href='verification.html'"
            >
                ادامه
                <span>←</span>
            </button>

        </form>

        <div class="footer-text">
            اطلاعات شما نزد ما محفوظ خواهد بود 🔒
        </div>

    </div>

</div>

</body>
</html>
